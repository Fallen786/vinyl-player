<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Vinyl Player</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="app-container">
            <h1>Vinyl Player</h1>

            <div class="turntable">
                <div class="tonearm" id="tonearm"></div>
                <div class="vinyl-record" id="vinyl">
                    <img
                        id="albumArt"
                        class="album-art"
                        src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300"
                        alt="Album Cover"
                    >
                </div>
            </div>

            <button id="loginBtn" style="margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer;">Connect with Spotify</button>
            <div id="songInfo" style="margin: 10px 0; font-size: 14px; color: #b3b3b3;">Not connected</div>
        </main>

<script>
// --- SPOTIFY CONFIGURATION ---
const CLIENT_ID = "702825189fb446248c5058fabff6bf62"; // <-- Paste your Client ID here!
const REDIRECT_URI = "https://fallen786.github.io/vinyl-player/"; // Must match your Spotify Dashboard exactly
const SCOPES = "user-read-playback-state user-read-currently-playing";

const loginBtn = document.getElementById("loginBtn");
const vinyl = document.getElementById("vinyl");
const tonearm = document.getElementById("tonearm");
const albumArt = document.getElementById("albumArt");
const songInfo = document.getElementById("songInfo");

// 1. Check if we just returned from Spotify with an authorization code
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('code');

if (code) {
  loginBtn.style.display = "none";
  exchangeCodeForToken(code);
} else {
  const savedToken = localStorage.getItem("spotify_access_token");
  if (savedToken) {
    loginBtn.style.display = "none";
    startPolling(savedToken);
  } else {
    loginBtn.addEventListener("click", redirectToSpotifyLogin);
  }
}

// 2. Redirect user to Spotify's login page using PKCE
async function redirectToSpotifyLogin() {
  const possible = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0-9";
  let codeVerifier = "";
  for (let i = 0; i < 64; i++) {
    codeVerifier += possible.charAt(Math.floor(Math.random() * possible.length));
  }
  localStorage.setItem("code_verifier", codeVerifier);

  const encoder = new TextEncoder();
  const data = encoder.encode(codeVerifier);
  const digest = await window.crypto.subtle.digest("SHA-256", data);
  
  const codeChallenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/=/g, "")
    .replace(/\+/g, "-")
    .replace(/\//g, "_");

  const authUrl = new URL("https://accounts.spotify.com/authorize");
  authUrl.searchParams.append("client_id", CLIENT_ID);
  authUrl.searchParams.append("response_type", "code");
  authUrl.searchParams.append("redirect_uri", REDIRECT_URI);
  authUrl.searchParams.append("code_challenge_method", "S256");
  authUrl.searchParams.append("code_challenge", codeChallenge);
  authUrl.searchParams.append("scope", SCOPES);

  window.location.href = authUrl.toString();
}

// 3. Exchange the login code for an access token
async function exchangeCodeForToken(code) {
  const codeVerifier = localStorage.getItem("code_verifier");

  const response = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: "authorization_code",
      code: code,
      redirect_uri: REDIRECT_URI,
      code_verifier: codeVerifier,
    }),
  });

  const data = await response.json();
  if (data.access_token) {
    localStorage.setItem("spotify_access_token", data.access_token);
    window.history.replaceState({}, document.title, window.location.pathname);
    startPolling(data.access_token);
  } else {
    songInfo.textContent = "Failed to login. Check console.";
    console.error(data);
  }
}

// 4. Poll Spotify API every 3 seconds to check what's playing
function startPolling(token) {
  songInfo.textContent = "Connected! Play a song on Spotify...";
  
  setInterval(async () => {
    try {
      const res = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
        headers: { Authorization: `Bearer ${token}` }
      });

      if (res.status === 204 || res.status > 400) {
        pauseTurntable("Nothing currently playing");
        return;
      }

      const data = await res.json();
      
      if (data && data.is_playing && data.item) {
        const trackName = data.item.name;
        const artistName = data.item.artists[0].name;
        const imageUrl = data.item.album.images[0].url;

        // Update UI & trigger the CSS classes you already made!
        songInfo.textContent = `${trackName} — ${artistName}`;
        albumArt.src = imageUrl;
        vinyl.classList.add("spinning");
        tonearm.classList.add("active");
      } else {
        pauseTurntable("Paused");
      }
    } catch (err) {
      console.error("Error fetching playback state:", err);
    }
  }, 3000);
}

function pauseTurntable(message) {
  songInfo.textContent = message;
  vinyl.classList.remove("spinning");
  tonearm.classList.remove("active");
}
</script>

    </body>
</html>
