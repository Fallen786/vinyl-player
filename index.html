<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Vinyl Player</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="app-container">
            <h1> Vinyl Player</h1>

            <div class="turntable">
                <div class="tonearm" id="tonearm"></div>
                <div class="vinyl-recorder" id="vinyl"></div>

                <img
                        id="album-art"
                        class="album-art"
                        src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300"
                        alt="Album Cover"
                        >

            </div>
        </main>
    </body>
</html>
