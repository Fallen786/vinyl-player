<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Vinyl Player</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="app-container">
            <h1>Vinyl Player</h1>

            <div class="turntable">
                <div class="tonearm" id="tonearm"></div>
                <div class="vinyl-record" id="vinyl">
                    <img
                        id="albumArt"
                        class="album-art"
                        src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300"
                        alt="Album Cover"
                    >
                </div>
            </div>

            <button id="toggleBtn" style="margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer;">
                Toggle Play/Pause
            </button>
        </main>

        <script>
            const vinyl = document.getElementById("vinyl");
            const tonearm = document.getElementById("tonearm");
            const toggleBtn = document.getElementById("toggleBtn");

            let isPlaying = false;

            toggleBtn.addEventListener("click", () => {
                isPlaying = !isPlaying;

                if (isPlaying) {
                    vinyl.classList.add("spinning");
                    tonearm.classList.add("active");
                    toggleBtn.textContent = "Pause";
                } else {
                    vinyl.classList.remove("spinning");
                    tonearm.classList.remove("active");
                    toggleBtn.textContent = "Play";
                }
            });
        </script>
    </body>
</html>
